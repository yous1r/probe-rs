name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and musl tools
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt --target "$TARGET"
          rustup default 1.100.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check optional container entrypoint syntax
        run: |
          sh -n deploy/rprobe-entrypoint.sh
          python3 -m py_compile scripts/verify_container_entrypoint.py
      - name: Lint Linux targets
        run: cargo clippy --locked --workspace --all-targets --target "$TARGET" -- -D warnings
      - name: Test on Linux musl
        run: cargo test --locked --workspace --target "$TARGET"
      - name: Build release binaries
        run: cargo build --locked --release --workspace --target "$TARGET"
      - name: Verify communication security boundaries
        run: python3 scripts/verify_security.py --bin-dir "target/$TARGET/release" --output-dir "$RUNNER_TEMP/rprobe-security"
      - name: Verify SQLite registry survives process crashes
        run: python3 scripts/verify_persistence.py --bin-dir "target/$TARGET/release" --output-dir "$RUNNER_TEMP/rprobe-persistence"
      - name: Verify optional agent does not block Docker application
        run: python3 scripts/verify_container_entrypoint.py --agent-binary "target/$TARGET/release/rprobe-agent" --output-dir "$RUNNER_TEMP/rprobe-entrypoint"
      - name: Upload container test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-entrypoint-diagnostics
          path: ${{ runner.temp }}/rprobe-entrypoint/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package agent and server separately
        run: |
          for component in rprobe-agent rprobe-server; do
            package_dir="dist/$component"
            mkdir -p "$package_dir"
            cp "target/$TARGET/release/$component" "$package_dir/"
            printf '%s\n' "$GITHUB_SHA" > "$package_dir/COMMIT"
            rustc -vV > "$package_dir/TOOLCHAIN.txt"
            readelf -l "$package_dir/$component" > "$RUNNER_TEMP/$component-elf.txt"
            if grep -q INTERP "$RUNNER_TEMP/$component-elf.txt"; then
              echo "Expected $component to be static without a dynamic interpreter" >&2
              exit 1
            fi
            (
              cd "$package_dir"
              file "$component" | tee BINARIES.txt
              sha256sum "$component" COMMIT TOOLCHAIN.txt BINARIES.txt > SHA256SUMS
            )
            tar -C "$package_dir" -czf "$component-$TARGET.tar.gz" \
              "$component" COMMIT TOOLCHAIN.txt BINARIES.txt SHA256SUMS
          done
      - name: Upload agent package
        uses: actions/upload-artifact@v4
        with:
          name: rprobe-agent-${{ env.TARGET }}
          path: rprobe-agent-${{ env.TARGET }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: rprobe-server-${{ env.TARGET }}
          path: rprobe-server-${{ env.TARGET }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
